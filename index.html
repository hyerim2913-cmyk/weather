<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나의 날씨 앱</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        #weather-info { margin-top: 20px; padding: 20px; border: 1px solid #ddd; display: inline-block; }
    </style>
</head>
<body>
    <h1>현재 동네 예보</h1>
    <button onclick="fetchWeather()">날씨 정보 가져오기</button>
    
    <div id="weather-info">
        <p id="status">버튼을 눌러주세요.</p>
        <ul id="details"></ul>
    </div>

    <script>
        async function fetchWeather() {
            const status = document.getElementById('status');
            const details = document.getElementById('details');
            status.innerText = "로딩 중...";
            details.innerHTML = "";

            try {
                // 내 서버(Vercel Function)에 요청을 보냅니다.
                const response = await fetch('/api/getWeather');
                const data = await response.json();

                if (data.response.header.resultCode === "00") {
                    status.innerText = "조회 성공!";
                    const items = data.response.body.items.item;
                    items.forEach(item => {
                        const li = document.createElement('li');
                        li.innerText = `${item.category}: ${item.fcstValue}`;
                        details.appendChild(li);
                    });
                } else {
                    status.innerText = "에러 발생: " + data.response.header.resultMsg;
                }
            } catch (error) {
                status.innerText = "데이터를 불러올 수 없습니다.";
            }
        }
    </script>
</body>
</html>
